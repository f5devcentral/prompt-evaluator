# GitLab CI/CD Pipeline for Prompt Evaluator
# Simplified configuration focusing on core functionality

stages:
  - test
  - quality

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CALYPSOAI_URL: "https://calypsoai.app"
  CALYPSOAI_TOKEN: "test_token_12345"

cache:
  paths:
    - .cache/pip/

# Core functionality testing
test-core:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-test.txt
  script:
    - echo "Running core functionality tests..."
    - python tests/test_runner_simple.py --core --verbose
  only:
    - master
    - merge_requests

# Test dataset converter
test-converter:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-test.txt
  script:
    - echo "Running dataset converter tests..."
    - python tests/test_runner_simple.py --converter --verbose
  only:
    - master
    - merge_requests

# Test enhanced reader
test-reader:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-test.txt
  script:
    - echo "Running enhanced reader tests..."
    - python tests/test_runner_simple.py --reader --verbose
  only:
    - master
    - merge_requests

# Test integration
test-integration:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-test.txt
  script:
    - echo "Running integration tests..."
    - python tests/test_runner_simple.py --integration --verbose
  only:
    - master
    - merge_requests

# Feature validation
test-features:
  stage: test
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Testing core features with CI-friendly script..."
    - python test_ci_features.py
  only:
    - master
    - merge_requests

# Code quality checks
lint:
  stage: quality
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install flake8 black
  script:
    - echo "Running code quality checks..."
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - black --check --diff .
  allow_failure: true
  only:
    - master
    - merge_requests

# Security scanning
security:
  stage: quality
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install bandit safety
  script:
    - echo "Running security scans..."
    - bandit -r . -f json -o bandit-report.json || echo "Bandit scan completed"
    - safety check --json --output safety-report.json || echo "Safety scan completed"
  artifacts:
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week
  allow_failure: true
  only:
    - master
    - merge_requests