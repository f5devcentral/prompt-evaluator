# GitHub Actions CI Pipeline for Prompt Evaluator
# Validated: 2026-05-27

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CALYPSOAI_URL: "https://us1.calypsoai.app"
  CALYPSOAI_TOKEN: "test_token_12345"

jobs:
  # ---------------------------------------------------------------------------
  # Test stage (all run in parallel, required to pass)
  # ---------------------------------------------------------------------------
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run core functionality tests
        run: python tests/test_runner_simple.py --core --verbose

  test-converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run dataset converter tests
        run: python tests/test_runner_simple.py --converter --verbose

  test-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run enhanced reader tests
        run: python tests/test_runner_simple.py --reader --verbose

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Run integration tests
        run: python tests/test_runner_simple.py --integration --verbose

  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install contract and format dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt -r requirements-parquet.txt
      - name: Run offline contracts with scoped coverage
        run: python tests/test_runner_simple.py --contract --verbose

  test-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run CI-friendly feature tests
        run: python test_ci_features.py

  # ---------------------------------------------------------------------------
  # Quality stage (non-blocking)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      - name: Run flake8 (critical errors)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run flake8 (all warnings)
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Check black formatting
        run: black --check --diff .

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      - name: Run bandit scan
        run: bandit -r . -f json -o bandit-report.json || echo "Bandit scan completed"
      - name: Run safety check
        run: safety check --json --output safety-report.json || echo "Safety scan completed"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 7
